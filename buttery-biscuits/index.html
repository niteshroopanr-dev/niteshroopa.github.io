n or delivery up to Thursday 24 December. Closed 25 and 26 December.",intro:"A tub of homemade biscuits earns its place at Christmas: on the table on the day, in a teacher\u2019s gift bag, or on the desk of every client you want to thank. December baking days are limited, so order early.",preset:{name:"Christmas tub",mix:["classic-butter","choc-fingers","custard"],note:"Butter rosettes, chocolate fingers and custard biscuits in one 1 kg tub."},bulk:"Teachers, staff, clients or the whole street? Orders over 10 kg come through a quick quote, with a 50% deposit to hold your date.",faqs:[["When is the last day to order for Christmas?","Friday 18 December, for collection or delivery up to Thursday 24 December, while there is space on the day. I\u2019m closed on 25 and 26 December."],["Can I order Christmas tubs as gifts for several people?","Yes. Add one tub per person to your basket. For more than 10 kg, send a bulk enquiry and I\u2019ll quote."]]},{slug:"eid",name:"Eid",theme:"eid",date:"2027-03-09",lastOrder:"2027-03-05",opens:"2027-01-25",greeting:"Eid Mubarak",title:"Eid Biscuits in Johannesburg",h1:"Eid biscuits, baked to order in Johannesburg",dateNote:"Eid al-Fitr 2027 is expected on Tuesday 9 or Wednesday 10 March, depending on the moon sighting. Eid orders open on Monday 25 January; bulk enquiries are welcome now.",intro:"Biscuits for the Eid table, for visitors through the day, and for family and neighbours. I bake each Eid order fresh in the days before, so it\u2019s crisp when your guests arrive.",preset:{name:"Eid tub",mix:["coconut","classic-butter","custard"],note:"Coconut, butter and custard biscuits in one 1 kg tub."},bulk:"Ordering for a large family or a gathering? Send a bulk enquiry with your numbers and date, and I\u2019ll reply with a quote.",faqs:[["When can I order for Eid?","Eid orders open on Monday 25 January 2027, and the last order date is Friday 5 March. Bulk enquiries are welcome any time."],["What goes into your biscuits?","Every ingredient is listed on each biscuit\u2019s page. If you have a question about any ingredient, WhatsApp me and I\u2019ll answer it directly."]]},{slug:"corporate-gifts",name:"Corporate gifts",theme:"corporate",date:"2026-12-11",lastOrder:"2026-12-04",corporate:!0,title:"Corporate Biscuit Gifts in Johannesburg",h1:"Corporate biscuit gifts in Johannesburg",dateNote:"For year-end gifts, send your enquiry by Friday 4 December so I can plan your baking days.",intro:"Homemade biscuits make a year-end gift that gets opened and shared. Tubs for clients, staff and suppliers, with your gift message, and printed labels with your logo on request.",preset:{name:"Year-end client tub",mix:["classic-butter","choc-fingers","coconut"],note:"Three favourites in one 1 kg tub."},bulk:"Send your numbers, dates and delivery addresses. I\u2019ll reply with a quote; a 50% deposit secures the baking days and the balance is due 72 hours before delivery.",faqs:[["Can you add our logo?","Yes, printed labels with your logo or message can be arranged on bulk orders. Ask in your enquiry and include the artwork if you have it."],["Can you deliver to several addresses?","Within 25 km of me, yes. Each address is a separate delivery at the fixed fee for its zone. I\u2019ll include them in your quote."]]}],h1=[["How far ahead should I order?","At least {notice} days ahead. Bookings open {horizon} days ahead, and festive dates fill early. Need it sooner? WhatsApp me and I\u2019ll tell you if I can fit it in."],["How long do homemade biscuits last, and how should I store them?","Best within three weeks of baking. Keep them in an airtight tin or tub at room temperature, away from sunlight and the stove. Chocolate-dipped biscuits like a cool cupboard in summer."],["Do you deliver to my suburb, and what does it cost?","I deliver up to 25 km from {suburb} for a fixed fee by distance: {zones}. Look up your suburb on the Delivery page. One fee covers the whole order."],["Can I collect, and when?","Yes, collection is
